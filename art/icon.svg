<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#84CC16"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14210A" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- the fact being appended -->
  <g stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M256 68 V 118"/>
    <path d="M224 96 L256 128 L288 96"/>
  </g>
  <!-- the ledger -->
  <g filter="url(#sh)">
    <rect x="112" y="160" width="288" height="240" rx="34" fill="#FFFFFF"/>
  </g>
  <g fill="url(#bg)">
    <circle cx="164" cy="212" r="14"/>
    <rect x="192" y="203" width="166" height="18" rx="9"/>
  </g>
  <g fill="url(#bg)" opacity="0.65">
    <circle cx="164" cy="280" r="14"/>
    <rect x="192" y="271" width="138" height="18" rx="9"/>
  </g>
  <g fill="url(#bg)" opacity="0.4">
    <circle cx="164" cy="348" r="14"/>
    <rect x="192" y="339" width="110" height="18" rx="9"/>
  </g>
</svg>
